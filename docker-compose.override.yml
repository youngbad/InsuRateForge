services:
  backend:
    volumes:
      - ./backend:/app
    command:
      [
        "sh",
        "-c",
        "uv sync --dev && uvicorn rateforge.main:app --reload --reload-dir /app/src --host 0.0.0.0 --port 8000",
      ]
    environment:
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    ports:
      - "5678:5678"

  worker:
    volumes:
      - ./backend:/app
    command:
      [
        "sh",
        "-c",
        "uv sync --dev && dramatiq rateforge.worker --watch /app/src",
      ]
    environment:
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    ports:
      - "5679:5679"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    command: ["sh", "-c", "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
      - "9229:9229"

  nginx:
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
